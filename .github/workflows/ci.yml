# Build check for pull requests.
#
# Kept separate from gatsby.yml on purpose: that workflow holds `pages: write`
# and `id-token: write` and runs in the shared "pages" concurrency group, so
# running it on pull requests would queue PR builds against production deploys.
name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Unlike the deploy workflow, superseded PR runs are safe to cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `npm ci` fails when package-lock.json is out of sync with package.json.
      # That exact desync reached main and broke the deploy before this existed.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
