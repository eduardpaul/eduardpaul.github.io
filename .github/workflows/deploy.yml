# Builds the Astro site and publishes it to GitHub Pages.
#
# Replaces the Gatsby workflow. Three things changed with the framework:
#   - the artifact comes from ./dist, not ./public (Astro's public/ is input)
#   - configure-pages no longer injects a Gatsby path prefix
#   - the Gatsby .cache/public restore step is gone; Astro has no such cache
name: Deploy to Pages

on:
  push:
    branches: ["main"]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do NOT cancel in-progress runs: these are
# production deployments and should be allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # `npm ci` fails when package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Runs prebuild (downloads cv.json's media and generates the manifest
      # icons), astro build, then pagefind over dist/.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
